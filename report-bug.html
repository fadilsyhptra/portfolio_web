<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Bug Report | Encryption Node</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/report.css">
</head>
<body>

  <div id="cyber-preloader">
    <div class="loader-content">
      <div class="spinner-hud"></div>
      <p class="loader-text">INITIALIZING SECURE NODE...</p>
    </div>
  </div>

  <nav class="mobile-navbar">
    <div class="nav-brand"><i class="fas fa-bug"></i> REPORT_NODE</div>
    <div class="nav-menu-wrapper">
      <button class="nav-toggle-btn" onclick="toggleMobileMenu()" aria-label="Toggle Navigation">
        <i class="fas fa-bars"></i>
      </button>
      <div class="nav-dropdown-content" id="mobileDropdown">
        <a href="index.html" class="nav-dropdown-item"><i class="fas fa-home"></i> Portfolio</a>
        <a href="chatbot.html" class="nav-dropdown-item purple-twin"><i class="fas fa-robot"></i> AI Twin</a>
      </div>
    </div>
  </nav>

  <div class="main-layout-wrapper">
    
    <div class="report-container">
      <div class="report-header">
        <div class="report-title">
          <i class="fas fa-bug"></i> ANOMALY_REPORT_NODE
        </div>
        <div class="report-subtitle">> STATUS: ENCRYPTED // ANONYMOUS TRACE</div>
      </div>

      <form name="anonymous-bug-reports" method="POST" data-netlify="true">
        <input type="hidden" name="form-name" value="anonymous-bug-reports" />

        <div class="form-group">
          <label class="form-label">> SELECT ANOMALY TYPE:</label>
          <select name="bug_type" class="form-select" required>
            <option value="UI Display Error">UI / Broken Display</option>
            <option value="Navigation Link Issue">Buttons / Navigation Glitch</option>
            <option value="AI Chatbot Anomaly">AI Twin Interaction Error</option>
            <option value="Other Glitch">Other Bug</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">> CHRONOLOGY DESCRIPTION:</label>
          <textarea name="bug_description" class="form-textarea" rows="6" placeholder="Briefly describe how the bug happened here..." required></textarea>
        </div>

        <div class="btn-group">
          <button type="submit" class="action-btn btn-submit">TRANSMIT LOG</button>
        </div>
      </form>
    </div>

    <div class="return-sidebox">
      <div class="sidebox-header">
        <div class="sidebox-title">> SYSTEM_REDIRECT</div>
        <p class="sidebox-subtitle">Choose your return vector:</p>
      </div>

      <div class="sidebox-diagnostics">
        <div class="terminal-header">
          <span class="terminal-dot red"></span>
          <span class="terminal-dot yellow"></span>
          <span class="terminal-dot green"></span>
          <span class="terminal-title">live_stream.log</span>
        </div>
        <div class="terminal-body" id="terminalConsole">
          <span class="terminal-cursor">_</span>
        </div>
      </div>

      <div class="sidebox-links">
        <a href="index.html" class="vector-btn btn-portfolio">
          <i class="fas fa-arrow-left"></i>
          <span>BACK TO PORTFOLIO</span>
        </a>
        <a href="chatbot.html" class="vector-btn btn-twin">
          <i class="fas fa-robot"></i>
          <span>BACK TO AI TWIN</span>
        </a>
      </div>
    </div>

  </div>

  <script>
    // 1. Preloader Closer
    window.addEventListener('load', () => {
      const preloader = document.getElementById('cyber-preloader');
      if (preloader) {
        setTimeout(() => { preloader.classList.add('loaded'); }, 500);
      }
    });

    // 2. Mobile Dropdown Menu Controller
    function toggleMobileMenu() {
      const dropdown = document.getElementById('mobileDropdown');
      if (dropdown) {
        dropdown.classList.toggle('show-menu');
      }
    }

    window.addEventListener('click', (e) => {
      if (!e.target.closest('.nav-menu-wrapper')) {
        const dropdown = document.getElementById('mobileDropdown');
        if (dropdown && dropdown.classList.contains('show-menu')) {
          dropdown.classList.remove('show-menu');
        }
      }
    });

    const logData = [
      "Connecting to core node 0x7FFF8C...",
      "Fetching portfolio index data structures...",
      "Syncing dynamic AI twin telemetry matrix...",
      "Flushing buffer console and reloading feed...\\n"
    ];

    const terminalBody = document.getElementById('terminalConsole');
    let lineIndex = 0;
    let charIndex = 0;

    function typeLogStream() {
      // Jika semua baris log sudah selesai diketik, bersihkan layar dan ulang dari awal
      if (lineIndex >= logData.length) {
        setTimeout(() => {
          terminalBody.innerHTML = '<span class="terminal-cursor">_</span>';
          lineIndex = 0;
          charIndex = 0;
          typeLogStream();
        }, 2500); // Jeda diam selama 2.5 detik saat log penuh sebelum di-reset bersih
        return;
      }

      // Inisialisasi baris paragraf baru jika sedang mengetik karakter pertama pada baris itu
      if (charIndex === 0) {
        const p = document.createElement('p');
        p.className = 'console-log-line';
        p.innerHTML = '<span class="prompt-prefix">> </span><span class="text-content"></span>';
        // Menyisipkan baris log tepat sebelum kursor (_)
        terminalBody.insertBefore(p, terminalBody.lastElementChild);
      }

      const activeLines = terminalBody.getElementsByClassName('console-log-line');
      const currentActiveLine = activeLines[activeLines.length - 1].querySelector('.text-content');
      
      const fullTextToType = logData[lineIndex];

      if (charIndex < fullTextToType.length) {
        currentActiveLine.textContent += fullTextToType.charAt(charIndex);
        charIndex++;
        // Efek ketikan natural berkecepatan acak (antara 30ms - 70ms per huruf)
        setTimeout(typeLogStream, 30 + Math.random() * 40);
      } else {
        // Pindah ke baris log berikutnya setelah jeda membaca (400ms)
        lineIndex++;
        charIndex = 0;
        setTimeout(typeLogStream, 400);
      }

      // Otomatis gulung scrollbar ke bawah agar kursor pengetikan selalu terlihat
      terminalBody.scrollTop = terminalBody.scrollHeight;
    }

    // Jalankan mesin ketik setelah preloader selesai bekerja
    setTimeout(typeLogStream, 1200);
  </script>

</body>
</html>
